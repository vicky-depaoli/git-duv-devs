<div class="form-card">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <h2>Nuevo libro</h2>

    <div>
      <input placeholder="Nombre del libro" formControlName="nombre" />
      <p *ngIf="submitted() && form.controls.nombre.invalid">El nombre es obligatorio</p>
    </div>

    <div>
      <input placeholder="ISMN" formControlName="ismn" />
      <p *ngIf="submitted() && form.controls.ismn.invalid">El ISMN es obligatorio</p>
    </div>

    <div>
      <label for="fecha">Fecha</label>
      <input id="fecha" type="date" formControlName="fecha" />
      <p *ngIf="submitted() && form.controls.fecha.invalid">La fecha es obligatoria</p>
    </div>

    <p *ngIf="errorMessage()">{{ errorMessage() }}</p>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Guardando...' : 'Guardar libro' }}
    </button>
  </form>
</div>
